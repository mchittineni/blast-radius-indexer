name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach an idle repository too.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # dist/ is a generated bundle of third-party code; scanning it would
          # bury this repository's own findings under vendor noise.
          config: |
            paths-ignore:
              - dist
              - coverage

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
