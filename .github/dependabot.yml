version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      # One pull request per concern keeps `dist/` rebuilds reviewable, since every
      # runtime bump changes the committed bundle.
      actions-toolkit:
        patterns: ['@actions/*']
      dev-tooling:
        dependency-type: development
        patterns: ['*']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
    labels: ['dependencies', 'github-actions']
